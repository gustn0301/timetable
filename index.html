        // --- UI Helper Functions ---

            ['login-view', 'setup-view', 'dashboard-view'].forEach(id => {

        const buildSetupForm = () => {
            const container = document.getElementById('select-containers');
            container.innerHTML = '';
            
            Object.keys(electivesData).forEach(key => {
                const data = electivesData[key];
                let optionsHtml = data.names.map((name, idx) => 
                    `<option value="${idx}">${name} (${data.teachers[idx]})</option>`
                ).join('');
                
                const selectGroup = `
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">${data.title}</label>
                        <select id="select-${key}" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">

                } else {

            let choices = {};
            let allSelected = true;
            Object.keys(electivesData).forEach(key => {
                const val = document.getElementById(`select-${key}`).value;
                if (val === "") allSelected = false;
                choices[key] = parseInt(val, 10);
            });
            return { choices, isValid: allSelected };

        const generatePersonalTimetable = () => {
            let schedule = JSON.parse(JSON.stringify(baseSchedule));

            for (let d = 0; d < 5; d++) {
                for (let p = 0; p < 7; p++) {
                    const cellInfo = schedule[d][p];
                    const type = cellInfo[3];
                    
                    if (electivesData[type]) {
                        const choiceIdx = userChoices[type];
                        const data = electivesData[type];
                        schedule[d][p] = [
                            data.names[choiceIdx],
                            data.teachers[choiceIdx],
                            data.rooms[choiceIdx],
                            type
                        ];
                    }
                }

            const getChoiceName = (key) => electivesData[key].names[userChoices[key]];

                schedule[day][period] = ["독서", tName, roomName, "Override"];
            };

            const bName = getChoiceName('B');
            const cName = getChoiceName('C');
            const dName = getChoiceName('D');

            if (dName === "심리") applyOverride(1, 0, "박성훈T", "2-2");
            if (eName === "교육의 이해") applyOverride(3, 0, "전민지T", "AI 인텔리랩");
            if (eName === "인간과 철학") applyOverride(3, 0, "김동해 신부님", "J301");
            if (eName === "논술") applyOverride(3, 1, "양정은T", "1층 도서관");

            generatedTimetable = schedule;
        };

        const renderTimetable = () => {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = '';

            for (let p = 0; p < 7; p++) {
                // 교시 열 (크기 대폭 축소)
                const timeStr = `${timeSchedule[p].start} ~ ${timeSchedule[p].end}`;
                tbody.insertAdjacentHTML('beforeend', `
                    <div class="flex flex-col items-center justify-center bg-gray-50 rounded-md p-1 font-bold text-gray-500 text-xs border border-gray-100 min-h-0">
                        <div class="mb-0.5">${p + 1}교시</div>
                        <div class="text-[9px] leading-tight text-center font-normal">${timeStr}</div>
                    </div>
                `);

                // 요일 열 (월-금)
                for (let d = 0; d < 5; d++) {
                    const cellData = generatedTimetable[d][p];
                    const isHighlighted = ourClassHighlights[d] && ourClassHighlights[d].includes(p);
                    
                    const bgClass = isHighlighted ? 'bg-sky-100 border-sky-200' : 'bg-white border-gray-200';
                    const textClass = isHighlighted ? 'text-sky-900' : 'text-gray-800';
                    
                    let innerHtml = '';
                    if (cellData[0]) {
                        innerHtml = `
                            <div class="font-bold text-xs ${textClass} truncate w-full text-center mb-0.5" title="${cellData[0]}">${cellData[0]}</div>
                            <div class="flex justify-between items-center w-full px-0.5 mt-auto">
                                <div class="text-[9px] text-gray-500 truncate" title="${cellData[1]}"><i class="fas fa-user-circle text-gray-400 mr-0.5"></i>${cellData[1].replace('T','').replace(' 신부님','').replace(' 수녀님','')}</div>
                                <div class="text-[9px] text-gray-500 truncate max-w-[55%]" title="${cellData[2]}">${cellData[2]}</div>
                            </div>
                        `;
                    } else {
                        innerHtml = `<div class="text-gray-300 text-xs">-</div>`;
                    }

                    tbody.insertAdjacentHTML('beforeend', `
                        <div class="timetable-cell flex flex-col items-center justify-center rounded-md border p-1 h-full min-h-[40px] ${bgClass}">
                            ${innerHtml}
                        </div>
                    `);
                }
            }
        };

        // --- Clock & Next Class Logic ---
        const updateClock = () => {
            const now = new Date();
            
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dateStr = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
            document.getElementById('current-date').textContent = dateStr;

            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hh}:${mm}:${ss}`;

            updateNextClassInfo(now);
        };

        const timeToMinutes = (timeStr) => {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        };

        const updateNextClassInfo = (now) => {
            const dayIdx = now.getDay() - 1;
            const currentMins = now.getHours() * 60 + now.getMinutes();
            
            const infoContainer = document.getElementById('next-class-info');

            if (dayIdx < 0 || dayIdx > 4 || (dayIdx === 4 && currentMins >= timeToMinutes(timeSchedule[6].end))) {
                infoContainer.innerHTML = `<div class="text-xs font-bold mt-1">정규 수업이 없습니다.</div>`;
                return;
            }

            let nextPeriodIdx = -1;
            let statusText = "다음 수업";

            for (let i = 0; i < timeSchedule.length; i++) {
                const sMins = timeToMinutes(timeSchedule[i].start);
                const eMins = timeToMinutes(timeSchedule[i].end);

                if (currentMins < sMins) {
                    nextPeriodIdx = i;
                    break;
                } else if (currentMins >= sMins && currentMins < eMins) {
                    if (i < 6) {
                        nextPeriodIdx = i + 1;
                        statusText = "다음 수업";
                    } else {
                        statusText = "마지막 수업 진행중";
                        nextPeriodIdx = -2;
                    }
                    break;
                }
            }

            if (currentMins >= timeToMinutes(timeSchedule[6].end)) {
                infoContainer.innerHTML = `<div class="text-xs font-bold mt-1">오늘의 정규 수업이 모두 끝났습니다.</div>`;
                return;
            }

            if (nextPeriodIdx === -2) {
                infoContainer.innerHTML = `<div class="text-xs font-bold mt-1">마지막 교시 수업 진행중입니다.</div>`;
                return;
            }

            if (nextPeriodIdx >= 0 && generatedTimetable.length > 0) {
                const cellData = generatedTimetable[dayIdx][nextPeriodIdx];
                if(cellData && cellData[0]) {
                     infoContainer.innerHTML = `
                        <div class="text-[10px] text-blue-200 mb-0.5">${nextPeriodIdx + 1}교시 ${statusText}</div>
                        <div class="text-base font-bold truncate">${cellData[0]}</div>
                        <div class="text-xs opacity-90 mt-1 flex items-center gap-2"><i class="fas fa-chalkboard-teacher text-[10px] w-3"></i> <span>${cellData[1]}</span></div>
                        <div class="text-xs opacity-90 flex items-center gap-2"><i class="fas fa-map-marker-alt text-[10px] w-3 ml-[1px]"></i> <span>${cellData[2]}</span></div>
                    `;
                } else {
                     infoContainer.innerHTML = `<div class="text-xs font-bold mt-1">다음 시간표 정보 없음</div>`;
                }
            }
        };

        // --- Notice Board Logic ---
        let unsubscribeNotice = null;
        
        const setupNoticeBoard = () => {
            const noticeRef = doc(db, 'publicData', 'board');
            
            unsubscribeNotice = onSnapshot(noticeRef, (docSnap) => {
                const displayArea = document.getElementById('notice-display');
                if (docSnap.exists()) {
                    displayArea.textContent = docSnap.data().content || "등록된 공지사항이 없습니다.";
                } else {
                    displayArea.textContent = "등록된 공지사항이 없습니다.";
                }
            });

            // 관리자 패널 비밀번호 변경됨: "nsdg26"
            document.getElementById('btn-edit-notice').addEventListener('click', () => {
                const pin = prompt("관리자 비밀번호를 입력하세요:");
                if (pin === "nsdg26") {
                    document.getElementById('notice-display').classList.add('hide');
                    document.getElementById('notice-edit-area').classList.remove('hide');
                    document.getElementById('notice-textarea').value = document.getElementById('notice-display').textContent === "등록된 공지사항이 없습니다." ? "" : document.getElementById('notice-display').textContent;
                } else if (pin !== null) {
                    alert("비밀번호가 틀렸습니다.");
                }
            });

            document.getElementById('btn-cancel-notice').addEventListener('click', () => {
                document.getElementById('notice-display').classList.remove('hide');
                document.getElementById('notice-edit-area').classList.add('hide');
            });

            document.getElementById('btn-save-notice').addEventListener('click', async () => {
                const content = document.getElementById('notice-textarea').value;
                try {
                    await setDoc(noticeRef, { content, updatedAt: new Date() });
                    document.getElementById('notice-display').classList.remove('hide');
                    document.getElementById('notice-edit-area').classList.add('hide');
                } catch (e) {
                    console.error("공지사항 저장 실패:", e);
                    alert("저장에 실패했습니다. 권한 설정을 확인하세요.");
                }
            });
        };

        // --- Firebase Auth & Initialization ---
        const initApp = () => {
            buildSetupForm();

            document.getElementById('setup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const { choices, isValid } = getFormData();
                
                if (!isValid) {
                    alert("모든 선택과목을 선택해주세요.");
                    return;
                }

                showLoading(true);
                userChoices = choices;
                
                try {
                    const userRef = doc(db, 'users', currentUser.uid);
                    await setDoc(userRef, { choices, updatedAt: new Date() });
                    
                    generatePersonalTimetable();
                    renderTimetable();
                    updateClock();
                    showView('dashboard-view');
                    
                    if(clockInterval) clearInterval(clockInterval);
                    clockInterval = setInterval(updateClock, 1000);
                    
                } catch (error) {
                    console.error("데이터 저장 실패:", error);
                    alert("설정 저장에 실패했습니다.");
                } finally {
                    showLoading(false);
                }
            });

            document.getElementById('btn-re-setup').addEventListener('click', () => {
                document.getElementById('btn-setup-cancel').classList.remove('hide');
                loadSetupDataToForm();
                showView('setup-view');
            });

            document.getElementById('btn-setup-cancel').addEventListener('click', () => {
                showView('dashboard-view');
            });

            // 구글 로그인 대신 익명 로그인 실행
            document.getElementById('btn-login').addEventListener('click', async () => {
                try {
                    showLoading(true);
                    await signInAnonymously(auth);
                } catch (error) {
                    console.error("로그인 에러:", error);
                    alert("바로 시작하기에 실패했습니다.");
                    showLoading(false);
                }
            });

            document.getElementById('btn-logout').addEventListener('click', () => {
                signOut(auth);
            });

            onAuthStateChanged(auth, async (user) => {
                showLoading(true);
                if (user) {
                    currentUser = user;
                    // 익명 로그인 시 displayName이 없으므로 임의의 이름으로 대체
                    const displayName = user.displayName || `학생(${user.uid.substring(0, 4)})`;
                    document.getElementById('user-name-display').textContent = `${displayName}님`;
                    
                    const userRef = doc(db, 'users', user.uid);
                    const docSnap = await getDoc(userRef);
                    
                    if (docSnap.exists() && docSnap.data().choices) {
                        userChoices = docSnap.data().choices;
                        generatePersonalTimetable();
                        renderTimetable();
                        
                        setupNoticeBoard();
                        
                        updateClock();
                        if(clockInterval) clearInterval(clockInterval);
                        clockInterval = setInterval(updateClock, 1000);
                        
                        showView('dashboard-view');
                    } else {
                        document.getElementById('btn-setup-cancel').classList.add('hide');
                        buildSetupForm();
                        showView('setup-view');
                    }
                } else {
                    currentUser = null;
                    if(clockInterval) clearInterval(clockInterval);
                    if(unsubscribeNotice) unsubscribeNotice();
                    showView('login-view');
                }
                showLoading(false);
            });
        };

        // Start
        initApp();

    </script>
</body>
</html>
