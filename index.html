<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 학급 실시간 시간표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .timetable-grid { display: grid; grid-template-columns: 80px repeat(5, 1fr); gap: 1px; background-color: #e2e8f0; border: 1px solid #e2e8f0; }
        .grid-header { background-color: #f1f5f9; font-weight: bold; text-align: center; padding: 10px; }
        .grid-cell { background-color: white; min-height: 80px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 0.85rem; }
        .current-period { background-color: #eff6ff; border: 2px solid #3b82f6; }
        .hidden { display: none !important; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- Auth Section -->
    <div id="auth-section" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
            <h1 class="text-3xl font-bold mb-6 text-blue-600">학급 시간표</h1>
            <p class="text-gray-500 mb-8">안전하게 로그인하여<br>나의 선택과목 시간표를 설정하세요.</p>
            <button id="google-login-btn" class="flex items-center justify-center w-full py-3 px-4 border border-gray-300 rounded-lg shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all">
                <img class="h-5 w-5 mr-2" src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google">
                구글 계정으로 로그인 시작
            </button>
            <p id="auth-error" class="text-red-500 text-sm mt-4 hidden"></p>
        </div>
    </div>

    <!-- Loading Section -->
    <div id="loading-section" class="hidden flex flex-col items-center justify-center min-h-screen p-4">
        <div class="loader mb-4"></div>
        <p class="text-gray-500">데이터를 불러오는 중입니다...</p>
    </div>

    <!-- Subject Setup Section -->
    <div id="setup-section" class="hidden container mx-auto px-4 py-8 max-w-2xl min-h-screen flex flex-col items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">선택 과목 설정</h2>
            <p class="text-sm text-center text-gray-500 mb-6">본인의 시간표에 맞춰 과목을 선택해주세요.</p>
            <div id="setup-form" class="space-y-4"></div>
            <button id="save-subjects-btn" class="w-full mt-8 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all shadow-md">설정 완료 및 저장</button>
            <p id="save-error" class="text-red-500 text-sm mt-4 hidden text-center"></p>
        </div>
    </div>

    <!-- Main Dashboard Section -->
    <div id="main-section" class="hidden min-h-screen flex flex-col md:flex-row overflow-hidden">
        <aside class="md:w-1/4 bg-white border-r p-6 flex flex-col space-y-8">
            <div class="text-center md:text-left">
                <div id="current-date" class="text-xl text-gray-600 font-medium"></div>
                <div id="current-time" class="text-5xl font-bold text-blue-600 mt-2"></div>
                <div id="current-day" class="text-2xl text-gray-400 mt-1"></div>
            </div>
            <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100 flex-grow">
                <h3 class="text-blue-800 font-bold text-lg mb-4 flex items-center">
                    <i class="fas fa-clock mr-2"></i> 다음 수업 안내
                </h3>
                <div id="next-class-info" class="space-y-3">
                    <p class="text-gray-400 italic">일정을 계산 중입니다...</p>
                </div>
            </div>
            <div class="bg-gray-900 text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
                <h3 class="font-bold text-lg mb-2 flex items-center relative z-10">
                    <i class="fas fa-bullhorn mr-2 text-yellow-400"></i> 공지사항
                </h3>
                <div id="notice-content" class="text-sm leading-relaxed relative z-10 opacity-90 min-h-[60px]">등록된 공지사항이 없습니다.</div>
                <button onclick="openAdminPanel()" class="absolute bottom-2 right-2 text-[10px] opacity-20 hover:opacity-100 transition-opacity">ADMIN</button>
            </div>
            <button onclick="showSetup()" class="text-sm text-gray-400 hover:text-blue-500 transition-colors">
                <i class="fas fa-cog mr-1"></i> 과목 다시 설정하기
            </button>
        </aside>

        <main class="flex-grow p-4 md:p-8 overflow-y-auto">
            <h2 class="text-2xl font-bold mb-6 flex items-center">
                <i class="fas fa-calendar-alt mr-3 text-blue-600"></i> 주간 시간표 (평일 1-7교시)
            </h2>
            <div class="timetable-grid rounded-lg shadow-sm overflow-hidden bg-white">
                <div class="grid-header">교시</div>
                <div class="grid-header">월</div>
                <div class="grid-header">화</div>
                <div class="grid-header">수</div>
                <div class="grid-header">목</div>
                <div class="grid-header">금</div>
                <script>
                    for (let p = 1; p <= 7; p++) {
                        document.write(`<div class="grid-cell font-bold bg-slate-50">${p}</div>`);
                        for (let d = 0; d < 5; d++) {
                            document.write(`<div id="cell-${d}-${p}" class="grid-cell border-l"></div>`);
                        }
                    }
                </script>
            </div>
        </main>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full">
            <h3 class="text-xl font-bold mb-4">공지사항 관리</h3>
            <div id="admin-auth" class="space-y-4">
                <input type="password" id="admin-pw" placeholder="관리자 코드 (1234)" class="w-full p-2 border rounded-lg">
                <button onclick="checkAdminPw()" class="w-full bg-black text-white py-2 rounded-lg">확인</button>
                <button onclick="closeAdminPanel()" class="w-full bg-gray-200 py-2 rounded-lg mt-2">취소</button>
            </div>
            <div id="admin-editor" class="hidden space-y-4">
                <textarea id="new-notice" class="w-full h-32 p-3 border rounded-lg text-sm" placeholder="공지사항 내용을 입력하세요..."></textarea>
                <div class="flex space-x-2">
                    <button onclick="saveNotice()" class="flex-grow bg-blue-600 text-white py-2 rounded-lg">저장</button>
                    <button onclick="closeAdminPanel()" class="flex-grow bg-gray-200 py-2 rounded-lg">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 환경 변수를 통한 안전한 Firebase 초기화
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(__firebase_config);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase Initialization Failed:", e);
            document.getElementById('auth-error').innerText = "서버 설정 오류: 데이터를 저장할 수 없는 환경입니다.";
            document.getElementById('auth-error').classList.remove('hidden');
        }

        let currentUser = null;
        let userSubjects = null;

        const subjectOptions = {
            "선택과목A": [
                { name: "주탐독", teacher: "황인해 선생님", room: "국어교과실" },
                { name: "인공수", teacher: "박동민 선생님", room: "수학교과실" },
                { name: "사문", teacher: "김형석 선생님", room: "AI 창의융합정보실" },
                { name: "현사윤", teacher: "여현주 선생님", room: "3-1" },
                { name: "물리", teacher: "이윤숙 선생님", room: "물리학 실험실" },
                { name: "화학", teacher: "김보련 선생님", room: "화학 실험실" },
                { name: "철학", teacher: "김동해 신부님", room: "J301" }
            ],
            "선택과목B": [
                { name: "주탐독", teacher: "황인해 선생님", room: "국어교과실" },
                { name: "세지", teacher: "지리온", room: "지능형 영어실" },
                { name: "물리1반", teacher: "유현영 선생님", room: "2-8" },
                { name: "물리2반", teacher: "이윤숙 선생님", room: "물리학 실험실" },
                { name: "화학", teacher: "김보련 선생님", room: "화학 실험실" },
                { name: "일어", teacher: "박성훈 선생님", room: "2-2" },

                { name: "논술", teacher: "배오현 선생님", room: "영어교과실" },
                { name: "심리", teacher: "김혜선 수녀님", room: "1-3" }
            ],
            "선택과목C": [
                { name: "정치", teacher: "김형석 선생님", room: "AI 창의융합정보실" },
                { name: "현사윤", teacher: "여현주 선생님", room: "3-1" },
                { name: "화학", teacher: "김보련 선생님", room: "화학 실험실" },
                { name: "생명", teacher: "류혜인 선생님", room: "지구과학 실험실" },
                { name: "지학", teacher: "정보온", room: "컴퓨터실" },
                { name: "프로", teacher: "박성훈 선생님", room: "2-2" },
                { name: "교육", teacher: "박성훈 선생님", room: "2-2" }
            ],
            "선택과목D": [

                { name: "물리", teacher: "유현영 선생님", room: "2-8" },

                { name: "프로2반", teacher: "정보온", room: "컴퓨터실" },
                { name: "철학", teacher: "김동해 신부님", room: "J301" },
                { name: "심리", teacher: "김혜선 수녀님", room: "2-2" }
            ],
            "선택과목E": [
                { name: "영발토", teacher: "배오현 선생님", room: "영어교과실" },
                { name: "세지", teacher: "지리온", room: "2-7" },
                { name: "현사윤", teacher: "여현주 선생님", room: "3-1" },
                { name: "물리", teacher: "유현영 선생님", room: "2-8" },
                { name: "화학", teacher: "김보련 선생님", room: "화학 실험실" },
                { name: "생명", teacher: "박성미 선생님", room: "3-5" },
                { name: "프로", teacher: "정보온", room: "컴퓨터실" },
                { name: "교육", teacher: "김형석 선생님", room: "AI 창의융합정보실" },
                { name: "철학", teacher: "김동해 신부님", room: "J301" },
                { name: "논술", teacher: "한종오 선생님", room: "3-6" }
            ],
            "음미": [
                { name: "음악", teacher: "최수미 선생님", room: "음악실" },
                { name: "미술", teacher: "홍현숙 선생님", room: "미술실" }
            ]
        };

        const scheduleBase = {
            0: [ { name: "영어I", teacher: "김영미 선생님", room: "2-7" }, { name: "대수", teacher: "장경희 선생님", room: "2-3" }, { name: "독작", teacher: "이수환 선생님", room: "지능형 영어실" }, { type: "select", key: "선택과목C" }, { type: "select", key: "선택과목B" }, { type: "select", key: "선택과목B" }, { name: "창체(동아리)", teacher: "-", room: "-" } ],
            1: [ { type: "select", key: "선택과목D" }, { type: "select", key: "선택과목D" }, { name: "대수", teacher: "장경희 선생님", room: "2-3" }, { type: "select", key: "선택과목A" }, { name: "영어I", teacher: "이지연 선생님", room: "2-1" }, { type: "select", key: "음미" }, { name: "체육I", teacher: "은현진 선생님", room: "마리아홀" } ],
            2: [ { type: "select", key: "선택과목C" }, { type: "select", key: "선택과목C" }, { name: "영어I", teacher: "이지연 선생님", room: "2-1" }, { name: "대수", teacher: "장경희 선생님", room: "2-3" }, { name: "독작", teacher: "한다솜 선생님", room: "2-6" }, { type: "select", key: "선택과목A" }, { name: "공강", teacher: "권민영 선생님", room: "-" } ],
            3: [ { type: "select", key: "선택과목E" }, { type: "select", key: "선택과목E" }, { name: "독작", teacher: "한다솜 선생님", room: "2-6" }, { type: "select", key: "선택과목B" }, { type: "select", key: "선택과목D" }, { type: "select", key: "선택과목A" }, { name: "독작", teacher: "이수환 선생님", room: "지능형 영어실" } ],
            4: [ { name: "체육I", teacher: "은현진 선생님", room: "마리아홀" }, { name: "대수", teacher: "장경희 선생님", room: "2-3" }, { type: "select", key: "음미" }, { type: "select", key: "선택과목E" }, { name: "영어I", teacher: "김영미 선생님", room: "2-7" }, { name: "창체", teacher: "-", room: "-" }, { name: "창체", teacher: "-", room: "-" } ]
        };

        const timeTableData = [
            { id: "p1", start: "08:40", end: "09:30", label: "1교시", period: 1 },
            { id: "p2", start: "09:40", end: "10:30", label: "2교시", period: 2 },
            { id: "p3", start: "10:40", end: "11:30", label: "3교시", period: 3 },
            { id: "p4", start: "11:40", end: "12:30", label: "4교시", period: 4 },
            { id: "p5", start: "13:30", end: "14:20", label: "5교시", period: 5 },
            { id: "p6", start: "14:30", end: "15:20", label: "6교시", period: 6 },
            { id: "p7", start: "15:40", end: "16:30", label: "7교시", period: 7 }
        ];

        const login = async () => {
            const btn = document.getElementById('google-login-btn');
            const errorText = document.getElementById('auth-error');
            btn.disabled = true;
            btn.innerText = "로그인 중...";
            errorText.classList.add('hidden');

            try {
                // Canvas 환경에 맞는 안전한 내부 인증 처리
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Login failed", error);
                errorText.innerText = "인증에 실패했습니다. 새로고침 후 다시 시도해주세요.";
                errorText.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "구글 계정으로 로그인 시작";
            }
        };

        const showSetup = () => {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('loading-section').classList.add('hidden');
            document.getElementById('main-section').classList.add('hidden');
            document.getElementById('setup-section').classList.remove('hidden');
            renderSetupForm();
        };

        const renderSetupForm = () => {
            const container = document.getElementById('setup-form');
            container.innerHTML = '';
            Object.keys(subjectOptions).forEach(key => {
                const label = document.createElement('label');
                label.className = "block text-sm font-semibold text-gray-700 mb-1 mt-4";
                label.innerText = key === '음미' ? '음악/미술 선택' : key;
                const select = document.createElement('select');
                select.id = `select-${key}`;
                select.className = "w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all";
                subjectOptions[key].forEach((opt, idx) => {
                    const option = document.createElement('option');
                    option.value = idx;
                    option.innerText = `${opt.name} (${opt.teacher})`;
                    if (userSubjects && userSubjects[key] == idx) option.selected = true;
                    select.appendChild(option);
                });
                container.appendChild(label);
                container.appendChild(select);
            });
        };

        const saveSubjects = async () => {
            if (!currentUser) return;
            
            const saveBtn = document.getElementById('save-subjects-btn');
            const errorMsg = document.getElementById('save-error');
            const originalText = saveBtn.innerText;
            
            saveBtn.disabled = true;
            saveBtn.innerText = "저장 중...";
            errorMsg.classList.add('hidden');

            const data = {};
            Object.keys(subjectOptions).forEach(key => {
                data[key] = document.getElementById(`select-${key}`).value;
            });

            try {
                // 정확한 Firestore 구조 규칙을 준수한 데이터 저장 경로
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'config');
                await setDoc(docRef, data);
                
                userSubjects = data;
                
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
                
                renderTimetable();
                updateRealTime();
            } catch (error) {
                console.error("Save failed:", error);
                errorMsg.innerText = "서버 저장 권한 오류가 발생했습니다. 브라우저를 새로고침 해보세요.";
                errorMsg.classList.remove('hidden');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = originalText;
            }
        };

        const renderTimetable = () => {
            if (!userSubjects) return;
            for (let d = 0; d < 5; d++) {
                const dayClasses = scheduleBase[d];
                dayClasses.forEach((cls, idx) => {
                    const period = idx + 1;
                    const cell = document.getElementById(`cell-${d}-${period}`);
                    if (!cell) return;
                    let finalInfo = cls;
                    if (cls.type === 'select') {
                        const selectedIdx = userSubjects[cls.key];
                        finalInfo = subjectOptions[cls.key][selectedIdx] || { name: '미선택', teacher: '-', room: '-' };
                    }
                    cell.innerHTML = `
                        <div class="font-bold text-blue-800">${finalInfo.name}</div>
                        <div class="text-[10px] text-gray-500">${finalInfo.teacher}</div>
                        <div class="text-[11px] mt-1 bg-gray-100 px-2 py-0.5 rounded text-gray-700">${finalInfo.room}</div>
                    `;
                });
            }
        };

        const updateRealTime = () => {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const daysArr = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const dayStr = daysArr[now.getDay()];

            const dateEl = document.getElementById('current-date');
            const timeEl = document.getElementById('current-time');
            const dayEl = document.getElementById('current-day');
            
            if(dateEl) dateEl.innerText = dateStr;
            if(timeEl) timeEl.innerText = timeStr;
            if(dayEl) dayEl.innerText = dayStr;

            if (userSubjects) updateNextClass(now);
        };

        const updateNextClass = (now) => {
            const currentTotalMin = now.getHours() * 60 + now.getMinutes();
            const currentDay = now.getDay(); 
            
            let activeSlot = null;
            let nextSlot = null;

            for(let i=0; i<timeTableData.length; i++) {
                const [sH, sM] = timeTableData[i].start.split(':').map(Number);
                const [eH, eM] = timeTableData[i].end.split(':').map(Number);
                const startMin = sH * 60 + sM;
                const endMin = eH * 60 + eM;

                if (currentTotalMin >= startMin && currentTotalMin < endMin) {
                    activeSlot = timeTableData[i];
                    nextSlot = timeTableData[i+1] || null;
                    break;
                } else if (currentTotalMin < startMin) {
                    nextSlot = timeTableData[i];
                    break;
                }
            }

            const infoBox = document.getElementById('next-class-info');
            if (!infoBox) return;

            let html = "";
            if (activeSlot) {
                const isClass = activeSlot.period && currentDay >= 1 && currentDay <= 5;
                let classData = null;
                if(isClass) {
                    const base = scheduleBase[currentDay-1][activeSlot.period-1];
                    if(base) classData = base.type === 'select' ? subjectOptions[base.key][userSubjects[base.key]] : base;
                }
                html += `<div class="mb-4"><span class="text-xs font-bold text-blue-500 uppercase">Now</span><p class="text-lg font-bold">${activeSlot.label}</p>${isClass && classData ? `<p class="text-sm text-gray-600">${classData.name} (${classData.room})</p>` : ''}</div>`;
            } else {
                html += `<div class="mb-4 text-gray-400">일과 외 시간입니다.</div>`;
            }

            if (nextSlot) {
                const isNextClass = nextSlot.period && currentDay >= 1 && currentDay <= 5;
                let nextClassData = null;
                if(isNextClass) {
                    const base = scheduleBase[currentDay-1][nextSlot.period-1];
                    if (base) nextClassData = base.type === 'select' ? subjectOptions[base.key][userSubjects[base.key]] : base;
                }
                html += `<div><span class="text-xs font-bold text-gray-400 uppercase">Next</span><p class="text-lg font-bold text-gray-700">${nextSlot.label} (${nextSlot.start})</p>${isNextClass && nextClassData ? `<p class="text-sm text-gray-600">${nextClassData.name} - ${nextClassData.room}</p>` : ''}</div>`;
            }
            infoBox.innerHTML = html;
        };

        // 관리자 공지사항 로직
        window.openAdminPanel = () => {
            document.getElementById('admin-auth').classList.remove('hidden');
            document.getElementById('admin-editor').classList.add('hidden');
            document.getElementById('admin-pw').value = '';
            document.getElementById('admin-modal').classList.remove('hidden');
        };
        window.closeAdminPanel = () => {
            document.getElementById('admin-modal').classList.add('hidden');
        };
        window.checkAdminPw = () => {
            if (document.getElementById('admin-pw').value === '1234') {
                document.getElementById('admin-auth').classList.add('hidden');
                document.getElementById('admin-editor').classList.remove('hidden');
                document.getElementById('new-notice').value = document.getElementById('notice-content').innerText;
            } else { alert('비밀번호가 틀렸습니다.'); }
        };
        window.saveNotice = async () => {
            if (!currentUser) return;
            const text = document.getElementById('new-notice').value;
            try {
                // 정확한 공지사항 저장 경로
                const noticeRef = doc(db, 'artifacts', appId, 'public', 'data', 'notices', 'main');
                await setDoc(noticeRef, { content: text, updated: new Date().getTime() });
                closeAdminPanel();
            } catch (error) {
                console.error("Notice save error", error);
                alert("공지사항 저장에 실패했습니다.");
            }
        };

        // 인증 상태 모니터링
        onAuthStateChanged(auth, async (user) => {
            const authSec = document.getElementById('auth-section');
            const loadingSec = document.getElementById('loading-section');
            const mainSec = document.getElementById('main-section');
            const setupSec = document.getElementById('setup-section');
            
            if (user) {
                currentUser = user;
                authSec.classList.add('hidden');
                loadingSec.classList.remove('hidden');
                
                // 설정 데이터 가져오기
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'config');
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        userSubjects = docSnap.data();
                        loadingSec.classList.add('hidden');
                        mainSec.classList.remove('hidden');
                        renderTimetable();
                    } else {
                        showSetup();
                    }
                } catch (e) {
                    console.error("Error fetching data:", e);
                    showSetup(); 
                }

                // 공지사항 실시간 감지
                try {
                    const noticeRef = doc(db, 'artifacts', appId, 'public', 'data', 'notices', 'main');
                    onSnapshot(noticeRef, (docSnap) => {
                        if (docSnap.exists()) {
                            document.getElementById('notice-content').innerText = docSnap.data().content;
                        }
                    }, (error) => console.error("Snapshot error:", error));
                } catch (e) {
                    console.error("공지사항 가져오기 에러:", e);
                }
            } else {
                authSec.classList.remove('hidden');
                mainSec.classList.add('hidden');
                loadingSec.classList.add('hidden');
                setupSec.classList.add('hidden');
            }
        });

        document.getElementById('google-login-btn').addEventListener('click', login);
        document.getElementById('save-subjects-btn').addEventListener('click', saveSubjects);
        window.showSetup = showSetup;
        setInterval(updateRealTime, 1000);
        updateRealTime();
    </script>
</body>
</html>
