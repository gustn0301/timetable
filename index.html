            33% { transform: translateY(-8px) rotate(1deg); }

            0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(99, 102, 241, 0); }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }

        .shimmer {
            background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.08) 50%, transparent 75%);
            background-size: 200% 100%;

        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

            -webkit-text-fill-color: transparent;
            background-clip: text;

        .bg-grid {

                title: "음/미",
                names: ["음악", "미술"],
                teachers: ["최수미T", "홍현숙T"],
                rooms: ["음악실", "미술실"]
            }
        };

        const baseSchedule = [
            [["체육I","강길재T","마리아홀","Base"],["독서와 작문","한다솜T","2-6","Base"],["대수","장경희T","2-3","Base"],["","","","C"],["","","","B"],["","","","B"],["창체(동아리)","-","-","Base"]],
            [["","","","D"],["","","","D"],["","","","M"],["","","","A"],["영어I","이지연T","2-1","Base"],["대수","장경희T","2-3","Base"],["독서와 작문","이수환T","공동교육과정실","Base"]],
            [["","","","C"],["","","","C"],["대수","장경희T","2-3","Base"],["영어I","김영미T","2-7","Base"],["독서와 작문","한다솜T","2-6","Base"],["","","","A"],["공강","권민영T","-","Base"]],
            [["","","","E"],["","","","E"],["체육I","은현진T","마리아홀","Base"],["","","","B"],["","","","D"],["","","","A"],["영어I","김영미T","2-7","Base"]],
            [["영어I","이지연T","2-1","Base"],["대수","장경희T","2-3","Base"],["","","","M"],["","","","E"],["독서와 작문","이수환T","2-7","Base"],["창체","-","-","Base"],["창체","-","-","Base"]]
        ];

        const ourClassHighlights = { 0:[3,4,5], 1:[0], 2:[0,1], 3:[2,3,4], 4:[2] };

        const timeSchedule = [
            {period:1,start:"08:40",end:"09:30"},{period:2,start:"09:40",end:"10:30"},
            {period:3,start:"10:40",end:"11:30"},{period:4,start:"11:40",end:"12:30"},
            {period:5,start:"13:30",end:"14:20"},{period:6,start:"14:30",end:"15:20"},
            {period:7,start:"15:40",end:"16:30"}
        ];

        let currentUser = null;
        let userChoices = {};
        let generatedTimetable = [];
        let clockInterval;

        const showView = (viewId) => {
            ['login-view','setup-view','dashboard-view'].forEach(id => {
                document.getElementById(id).classList.add('hide');
            });
            document.getElementById(viewId).classList.remove('hide');
        };
        const showLoading = (show) => {
            document.getElementById('loading').classList.toggle('hide', !show);
        };

        const buildSetupForm = () => {
            const container = document.getElementById('select-containers');
            container.innerHTML = '';
            
            const icons = { A: 'fa-book', B: 'fa-flask', C: 'fa-microscope', D: 'fa-laptop-code', E: 'fa-globe', M: 'fa-music' };
            const colors = { A: 'indigo', B: 'purple', C: 'emerald', D: 'blue', E: 'rose', M: 'amber' };
            
            Object.keys(electivesData).forEach(key => {
                const data = electivesData[key];
                let optionsHtml = data.names.map((name, idx) =>
                    `<option value="${idx}">${name} — ${data.teachers[idx]}</option>`
                ).join('');

                const selectGroup = `
                    <div class="group">
                        <label class="flex items-center gap-2 text-sm font-bold text-gray-700 mb-2">
                            <div class="w-6 h-6 bg-${colors[key]}-100 rounded-md flex items-center justify-center">
                                <i class="fas ${icons[key]} text-${colors[key]}-500 text-[10px]"></i>
                            </div>
                            ${data.title}
                        </label>
                        <select id="select-${key}" class="w-full border border-gray-200 rounded-xl p-3 bg-gray-50 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400 outline-none transition text-sm pr-10 hover:border-gray-300">
                            <option value="" disabled selected>과목을 선택하세요</option>
                            ${optionsHtml}
                        </select>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', selectGroup);
            });
        };

        const loadSetupDataToForm = () => {
            Object.keys(electivesData).forEach(key => {
                const select = document.getElementById(`select-${key}`);
                if (userChoices[key] !== undefined) select.value = userChoices[key];
                else select.value = "";
            });
        };

        const getFormData = () => {
            let choices = {};
            let allSelected = true;
            Object.keys(electivesData).forEach(key => {
                const val = document.getElementById(`select-${key}`).value;
                if (val === "") allSelected = false;
                choices[key] = parseInt(val, 10);
            });
            return { choices, isValid: allSelected };
        };

        const generatePersonalTimetable = () => {
            let schedule = JSON.parse(JSON.stringify(baseSchedule));
            for (let d = 0; d < 5; d++) {
                for (let p = 0; p < 7; p++) {
                    const cellInfo = schedule[d][p];
                    const type = cellInfo[3];
                    if (electivesData[type]) {
                        const choiceIdx = userChoices[type];
                        const data = electivesData[type];
                        schedule[d][p] = [data.names[choiceIdx], data.teachers[choiceIdx], data.rooms[choiceIdx], type];
                    }
                }
            }
            const getChoiceName = (key) => electivesData[key].names[userChoices[key]];
            const applyOverride = (day, period, tName, roomName) => {
                schedule[day][period] = ["독서", tName, roomName, "Override"];
            };
            const aName = getChoiceName('A'), bName = getChoiceName('B'), cName = getChoiceName('C');
            const dName = getChoiceName('D'), eName = getChoiceName('E');
            if (aName === "인간과 철학") applyOverride(2, 5, "권민영T", "보건교육실");
            if (bName === "논술") applyOverride(0, 5, "전민지T", "AI 인텔리랩");
            if (bName === "심리") applyOverride(0, 4, "양정은T", "1층 도서관");
            if (cName === "교육의 이해") applyOverride(2, 0, "박성훈T", "2-2");
            if (dName === "인간과 철학") applyOverride(1, 0, "권민영T", "보건교육실");
            if (dName === "심리") applyOverride(1, 0, "박성훈T", "2-2");
            if (eName === "교육의 이해") applyOverride(3, 0, "전민지T", "AI 인텔리랩");
            if (eName === "인간과 철학") applyOverride(3, 0, "김동해 신부님", "J301");
            if (eName === "논술") applyOverride(3, 1, "양정은T", "1층 도서관");
            generatedTimetable = schedule;
        };

        const renderTimetable = () => {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = '';

            const now = new Date();
            const todayDayIdx = now.getDay() - 1;
            const currentMins = now.getHours() * 60 + now.getMinutes();

            for (let p = 0; p < 7; p++) {
                const timeStr = `${timeSchedule[p].start}~${timeSchedule[p].end}`;
                tbody.insertAdjacentHTML('beforeend', `
                    <div class="flex flex-col items-center justify-center bg-slate-50 rounded-xl p-1 font-bold text-slate-400 text-xs border border-slate-100 min-h-0">
                        <div class="text-slate-500 text-[11px]">${p + 1}</div>
                        <div class="text-[8px] leading-tight text-center font-medium text-slate-300 mt-0.5">${timeStr}</div>
                    </div>
                `);

                for (let d = 0; d < 5; d++) {
                    const cellData = generatedTimetable[d][p];
                    const isHighlighted = ourClassHighlights[d] && ourClassHighlights[d].includes(p);
                    
                    // Check if this is the current period
                    let isCurrent = false;
                    if (d === todayDayIdx && todayDayIdx >= 0 && todayDayIdx <= 4) {
                        const sMins = timeToMinutes(timeSchedule[p].start);
                        const eMins = timeToMinutes(timeSchedule[p].end);
                        if (currentMins >= sMins && currentMins < eMins) isCurrent = true;
                    }

                    let bgClass, textClass, borderExtra = '';
                    if (isCurrent) {
                        bgClass = 'bg-indigo-50 border-indigo-300';
                        textClass = 'text-indigo-900';
                        borderExtra = 'pulse-current ring-1 ring-indigo-200';
                    } else if (isHighlighted) {
                        bgClass = 'bg-sky-50 border-sky-200';
                        textClass = 'text-sky-900';
                    } else {
                        bgClass = 'bg-white border-gray-100';
                        textClass = 'text-gray-800';
                    }

                    let innerHtml = '';
                    if (cellData[0]) {
                        const currentDot = isCurrent ? `<div class="absolute top-1 right-1 w-1.5 h-1.5 bg-indigo-500 rounded-full"></div>` : '';
                        innerHtml = `
                            ${currentDot}
                            <div class="font-bold text-[11px] ${textClass} truncate w-full text-center mb-0.5" title="${cellData[0]}">${cellData[0]}</div>
                            <div class="flex justify-between items-center w-full px-0.5 mt-auto gap-1">
                                <div class="text-[8px] text-gray-400 truncate font-medium">${cellData[1].replace('T','').replace(' 신부님','').replace(' 수녀님','')}</div>
                                <div class="text-[8px] text-gray-400 truncate max-w-[55%]">${cellData[2]}</div>
                            </div>
                        `;
                    } else {
                        innerHtml = `<div class="text-gray-200 text-xs">—</div>`;
                    }

                    tbody.insertAdjacentHTML('beforeend', `
                        <div class="timetable-cell relative flex flex-col items-center justify-center rounded-xl border p-1.5 h-full min-h-[40px] ${bgClass} ${borderExtra}">
                            ${innerHtml}
                        </div>
                    `);
                }
            }
        };

        const updateClock = () => {
            const now = new Date();
            const days = ['일','월','화','수','목','금','토'];
            const dateStr = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
            document.getElementById('current-date').textContent = dateStr;
            const hh = String(now.getHours()).padStart(2,'0');
            const mm = String(now.getMinutes()).padStart(2,'0');
            const ss = String(now.getSeconds()).padStart(2,'0');
            document.getElementById('current-time').textContent = `${hh}:${mm}:${ss}`;
            updateNextClassInfo(now);
        };

        const timeToMinutes = (timeStr) => {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        };

        const updateNextClassInfo = (now) => {
            const dayIdx = now.getDay() - 1;
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const infoContainer = document.getElementById('next-class-info');

            if (dayIdx < 0 || dayIdx > 4 || (dayIdx === 4 && currentMins >= timeToMinutes(timeSchedule[6].end))) {
                infoContainer.innerHTML = `<div class="text-sm font-bold mt-1 opacity-80">정규 수업이 없습니다</div>`;
                return;
            }

            let nextPeriodIdx = -1;
            let statusText = "다음 수업";
            for (let i = 0; i < timeSchedule.length; i++) {
                const sMins = timeToMinutes(timeSchedule[i].start);
                const eMins = timeToMinutes(timeSchedule[i].end);
                if (currentMins < sMins) { nextPeriodIdx = i; break; }
                else if (currentMins >= sMins && currentMins < eMins) {
                    if (i < 6) { nextPeriodIdx = i + 1; statusText = "다음 수업"; }
                    else { statusText = "마지막 수업 진행중"; nextPeriodIdx = -2; }
                    break;
                }
            }

            if (currentMins >= timeToMinutes(timeSchedule[6].end)) {
                infoContainer.innerHTML = `<div class="text-sm font-bold mt-1 opacity-80">오늘 수업이 모두 끝났습니다</div>`;
                return;
            }
            if (nextPeriodIdx === -2) {
                infoContainer.innerHTML = `<div class="text-sm font-bold mt-1 opacity-80">마지막 교시 진행중</div>`;
                return;
            }
            if (nextPeriodIdx >= 0 && generatedTimetable.length > 0) {
                const cellData = generatedTimetable[dayIdx][nextPeriodIdx];
                if (cellData && cellData[0]) {
                    infoContainer.innerHTML = `
                        <div class="text-[10px] text-indigo-300 mb-1 font-medium">${nextPeriodIdx+1}교시 · ${statusText}</div>
                        <div class="text-lg font-extrabold truncate tracking-tight">${cellData[0]}</div>
                        <div class="text-xs opacity-80 mt-1.5 flex items-center gap-2"><i class="fas fa-chalkboard-teacher text-[10px] w-3 text-indigo-300"></i> <span>${cellData[1]}</span></div>
                        <div class="text-xs opacity-80 flex items-center gap-2"><i class="fas fa-map-marker-alt text-[10px] w-3 text-indigo-300"></i> <span>${cellData[2]}</span></div>
                    `;
                } else {
                    infoContainer.innerHTML = `<div class="text-sm font-bold mt-1 opacity-80">다음 시간표 정보 없음</div>`;
                }
            }
        };

        let unsubscribeNotice = null;
        const setupNoticeBoard = () => {
            const noticeRef = doc(db, 'publicData', 'board');
            unsubscribeNotice = onSnapshot(noticeRef, (docSnap) => {
                const displayArea = document.getElementById('notice-display');
                if (docSnap.exists()) displayArea.textContent = docSnap.data().content || "등록된 공지사항이 없습니다.";
                else displayArea.textContent = "등록된 공지사항이 없습니다.";
            });

            document.getElementById('btn-edit-notice').addEventListener('click', () => {
                const pin = prompt("관리자 비밀번호를 입력하세요:");
                if (pin === "nsdg26") {
                    document.getElementById('notice-display').classList.add('hide');
                    document.getElementById('notice-edit-area').classList.remove('hide');
                    const current = document.getElementById('notice-display').textContent;
                    document.getElementById('notice-textarea').value = current === "등록된 공지사항이 없습니다." ? "" : current;
                } else if (pin !== null) {
                    alert("비밀번호가 틀렸습니다.");
                }
            });
            document.getElementById('btn-cancel-notice').addEventListener('click', () => {
                document.getElementById('notice-display').classList.remove('hide');
                document.getElementById('notice-edit-area').classList.add('hide');
            });
            document.getElementById('btn-save-notice').addEventListener('click', async () => {
                const content = document.getElementById('notice-textarea').value;
                try {
                    await setDoc(noticeRef, { content, updatedAt: new Date() });
                    document.getElementById('notice-display').classList.remove('hide');
                    document.getElementById('notice-edit-area').classList.add('hide');
                } catch (e) {
                    console.error("공지사항 저장 실패:", e);
                    alert("저장에 실패했습니다. 권한 설정을 확인하세요.");
                }
            });
        };

        const initApp = () => {
            buildSetupForm();

            document.getElementById('setup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const { choices, isValid } = getFormData();
                if (!isValid) { alert("모든 선택과목을 선택해주세요."); return; }
                showLoading(true);
                userChoices = choices;
                try {
                    const userRef = doc(db, 'users', currentUser.uid);
                    await setDoc(userRef, { choices, updatedAt: new Date() });
                    generatePersonalTimetable();
                    renderTimetable();
                    updateClock();
                    showView('dashboard-view');
                    if (clockInterval) clearInterval(clockInterval);
                    clockInterval = setInterval(updateClock, 1000);
                } catch (error) {
                    console.error("데이터 저장 실패:", error);
                    alert("설정 저장에 실패했습니다.");
                } finally {
                    showLoading(false);
                }
            });

            document.getElementById('btn-re-setup').addEventListener('click', () => {
                document.getElementById('btn-setup-cancel').classList.remove('hide');
                loadSetupDataToForm();
                showView('setup-view');
            });
            document.getElementById('btn-setup-cancel').addEventListener('click', () => {
                showView('dashboard-view');
            });
            document.getElementById('btn-login').addEventListener('click', async () => {
                try {
                    showLoading(true);
                    await signInAnonymously(auth);
                } catch (error) {
                    console.error("로그인 에러:", error);
                    alert("바로 시작하기에 실패했습니다.");
                    showLoading(false);
                }
            });
            document.getElementById('btn-logout').addEventListener('click', () => { signOut(auth); });

            onAuthStateChanged(auth, async (user) => {
                showLoading(true);
                if (user) {
                    currentUser = user;
                    const displayName = user.displayName || `학생(${user.uid.substring(0,4)})`;
                    document.getElementById('user-name-display').textContent = `${displayName}님`;
                    const userRef = doc(db, 'users', user.uid);
                    const docSnap = await getDoc(userRef);
                    if (docSnap.exists() && docSnap.data().choices) {
                        userChoices = docSnap.data().choices;
                        generatePersonalTimetable();
                        renderTimetable();
                        setupNoticeBoard();
                        updateClock();
                        if (clockInterval) clearInterval(clockInterval);
                        clockInterval = setInterval(updateClock, 1000);
                        showView('dashboard-view');
                    } else {
                        document.getElementById('btn-setup-cancel').classList.add('hide');
                        buildSetupForm();
                        showView('setup-view');
                    }
                } else {
                    currentUser = null;
                    if (clockInterval) clearInterval(clockInterval);
                    if (unsubscribeNotice) unsubscribeNotice();
                    showView('login-view');
                }
                showLoading(false);
            });
        };

        initApp();
    </script>
</body>
</html>
