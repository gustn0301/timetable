        body, html { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #f8fafc; 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
        }
        
        .timetable-grid { 
            display: grid; 
            grid-template-columns: 45px repeat(5, 1fr); 
            grid-template-rows: 35px repeat(7, 1fr); 
            height: 100%; 
            border-top: 2px solid #3b82f6;
            background-color: #e2e8f0; 
            gap: 1px;
        }
        
        .grid-header { 
            background-color: #f1f5f9; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.8rem; 
            color: #475569;
        }
        
        .grid-cell { 
            background-color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 2px;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }
        
        .bg-homeroom { background-color: #e0f2fe !important; } /* 우리반 수업 (하늘색) */
        .bg-current { background-color: #ffedd5 !important; border: 2px solid #f97316 !important; z-index: 10; } /* 현재교시 */

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>

            // B: 논술 -> 월(0) 6교시(5) / 심리 -> 월(0) 5교시(4)
            if (isMatch(0, 5, '선택과목B', '논술')) return { name: '독서', teacher: '전민지 선생님', room: 'AI 인텔리랩', isSub: true };
            if (isMatch(0, 4, '선택과목B', '심리')) return { name: '독서', teacher: '양정은 선생님', room: '도서관', isSub: true };
            
            // C: 교육 -> 수(2) 1교시(0)
            if (isMatch(2, 0, '선택과목C', '교육')) return { name: '독서', teacher: '박성훈 선생님', room: '2-2', isSub: true };
            
            // D: 철학 -> 화(1) 1교시(0) / 심리 -> 화(1) 1교시(0)
            if (isMatch(1, 0, '선택과목D', '철학')) return { name: '독서', teacher: '권민영 선생님', room: '보건교육실', isSub: true };
            if (isMatch(1, 0, '선택과목D', '심리')) return { name: '독서', teacher: '박성훈 선생님', room: '2-2', isSub: true };
            
            // E: 교육 -> 목(3) 1교시(0) / 철학 -> 목(3) 1교시(0) / 논술 -> 목(3) 2교시(1)
            if (isMatch(3, 0, '선택과목E', '교육')) return { name: '독서', teacher: '전민지 선생님', room: 'AI 인텔리랩', isSub: true };
            if (isMatch(3, 0, '선택과목E', '철학')) return { name: '독서', teacher: '김동해 신부님', room: 'J301', isSub: true };
            if (isMatch(3, 1, '선택과목E', '논술')) return { name: '독서', teacher: '양정은 선생님', room: '도서관', isSub: true };

            // 대체 조건에 해당하지 않으면 원래 선택한 과목 반환
            return selectedSubject;
        };

        const login = async () => {
            const btn = document.getElementById('google-login-btn');
            const errorText = document.getElementById('auth-error');
            btn.disabled = true;
            btn.innerText = "로그인 중...";
            errorText.classList.add('hidden');

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    try {
                        const provider = new GoogleAuthProvider();
                        await signInWithPopup(auth, provider);
                    } catch (e) {
                        await signInAnonymously(auth);
                    }
                }
            } catch (error) {
                console.error("Login failed", error);
                errorText.innerText = "로그인에 실패했습니다.";
                errorText.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "구글 로그인 시작";
            }
        };

        const showSetup = () => {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('loading-section').classList.add('hidden');
            document.getElementById('main-section').classList.add('hidden');
            document.getElementById('setup-section').classList.remove('hidden');
            renderSetupForm();
        };

        const renderSetupForm = () => {
            const container = document.getElementById('setup-form');
            container.innerHTML = '';
            Object.keys(subjectOptions).forEach(key => {
                const wrapper = document.createElement('div');
                const label = document.createElement('label');
                label.className = "block text-[11px] font-semibold text-gray-700 mb-1";
                label.innerText = key === '음미' ? '음악/미술 선택' : key;
                const select = document.createElement('select');
                select.id = `select-${key}`;
                select.className = "w-full p-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none";
                subjectOptions[key].forEach((opt, idx) => {
                    const option = document.createElement('option');
                    option.value = idx;
                    option.innerText = `${opt.name} (${opt.teacher})`;
                    if (userSubjects && userSubjects[key] == idx) option.selected = true;
                    select.appendChild(option);
                });
                wrapper.appendChild(label);
                wrapper.appendChild(select);
                container.appendChild(wrapper);
            });
        };

        const saveSubjects = async () => {
            if (!currentUser) return;
            const saveBtn = document.getElementById('save-subjects-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = "저장 중...";
            const data = {};
            Object.keys(subjectOptions).forEach(key => { data[key] = document.getElementById(`select-${key}`).value; });

            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'config'), data);
                userSubjects = data;
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
                renderTimetable();
                updateRealTime();
            } catch (error) {
                document.getElementById('save-error').innerText = "저장 실패. 권한을 확인해주세요.";
                document.getElementById('save-error').classList.remove('hidden');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "설정 완료 및 저장";
            }
        };

        const renderTimetable = () => {
            if (!userSubjects) return;
            for (let d = 0; d < 5; d++) {
                for (let idx = 0; idx < 7; idx++) {
                    const period = idx + 1;
                    const cell = document.getElementById(`cell-${d}-${period}`);
                    if (!cell) continue;
                    
                    // getClassInfo 함수를 통해 최종 정보(독서 대체 여부 포함)를 가져옴
                    const finalInfo = getClassInfo(d, idx);
                    
                    // 요일과 교시 확인하여 하늘색 배경 적용
                    const slotKey = `${d}-${period}`;
                    if (homeroomSlots.includes(slotKey)) cell.classList.add('bg-homeroom');
                    else cell.classList.remove('bg-homeroom');

                    // 텍스트 렌더링 (독서 대체 과목은 글씨 색상을 살짝 다르게 표현할 수도 있지만 동일하게 유지)
                    const titleClass = finalInfo.isSub ? "text-green-700 font-extrabold" : "text-gray-800 font-bold";
                    
                    cell.innerHTML = `
                        <div class="${titleClass} text-xs sm:text-sm leading-tight">${finalInfo.name}</div>
                        <div class="text-[9px] sm:text-[10px] text-gray-500 mt-0.5 truncate w-full px-1">${finalInfo.teacher}</div>
                        <div class="text-[9px] sm:text-[10px] mt-1 bg-white/70 px-1.5 py-0.5 rounded text-blue-700 font-semibold border border-blue-100">${finalInfo.room}</div>
                    `;
                }
            }
        };

        const updateRealTime = () => {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const daysArr = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const dayStr = daysArr[now.getDay()];

            document.getElementById('current-date').innerText = dateStr;
            document.getElementById('current-time').innerText = timeStr;
            document.getElementById('current-day').innerText = dayStr;

            if (userSubjects) updateNextClass(now);
        };

        const updateNextClass = (now) => {
            const currentTotalMin = now.getHours() * 60 + now.getMinutes();
            const currentDay = now.getDay(); 
            
            let activeSlot = null;
            let nextSlot = null;

            for(let i=0; i<timeTableData.length; i++) {
                const [sH, sM] = timeTableData[i].start.split(':').map(Number);
                const [eH, eM] = timeTableData[i].end.split(':').map(Number);
                const startMin = sH * 60 + sM;
                const endMin = eH * 60 + eM;

                if (currentTotalMin >= startMin && currentTotalMin < endMin) {
                    activeSlot = timeTableData[i];
                    nextSlot = timeTableData[i+1] || null;
                    break;
                } else if (currentTotalMin < startMin) {
                    nextSlot = timeTableData[i];
                    break;
                }
            }

            document.querySelectorAll('.bg-current').forEach(el => el.classList.remove('bg-current'));
            if (activeSlot && activeSlot.period && currentDay >= 1 && currentDay <= 5) {
                const activeCell = document.getElementById(`cell-${currentDay-1}-${activeSlot.period}`);
                if (activeCell) activeCell.classList.add('bg-current');
            }

            const infoBox = document.getElementById('next-class-info');
            if (!infoBox) return;

            let html = "";
            
            if (activeSlot && activeSlot.period && currentDay >= 1 && currentDay <= 5) {
                // 실시간 수업 정보에서도 대체된 독서 과목 정보를 정확히 띄우도록 getClassInfo 활용
                let cData = getClassInfo(currentDay-1, activeSlot.period-1);
                html += `
                    <div class="mb-2">
                        <span class="text-[10px] font-bold text-orange-500 bg-orange-50 px-1.5 py-0.5 rounded border border-orange-200">NOW</span>
                        <p class="text-sm font-bold text-gray-800 mt-1">${activeSlot.label} 진행중</p>
                        <p class="text-xs ${cData.isSub ? 'text-green-600 font-bold' : 'text-gray-600'}">${cData.name} (${cData.room})</p>
                    </div>`;
            } else if (!activeSlot) {
                html += `<div class="mb-2 text-xs text-gray-500">현재 대기 중입니다.</div>`;
            }

            if (nextSlot) {
                const [sH, sM] = nextSlot.start.split(':').map(Number);
                const startMin = sH * 60 + sM;
                const diff = startMin - currentTotalMin;

                if (diff <= 10 && diff > 0) {
                    const isNextClass = nextSlot.period && currentDay >= 1 && currentDay <= 5;
                    let nData = null;
                    if(isNextClass) nData = getClassInfo(currentDay-1, nextSlot.period-1);
                    
                    html += `
                    <div class="mt-2 p-2.5 bg-blue-50 border border-blue-200 rounded-lg animate-pulse shadow-sm">
                        <div class="flex items-center text-blue-600 font-bold text-[11px] mb-1">
                            <i class="fas fa-bell mr-1"></i> 곧 시작 (${diff}분 전)
                        </div>
                        <p class="text-sm font-bold text-gray-900">${nextSlot.label} (${nextSlot.start})</p>
                        ${nData ? `<p class="text-xs ${nData.isSub ? 'text-green-700 font-bold' : 'text-gray-700'} mt-0.5">${nData.name} - ${nData.room}</p>` : ''}
                    </div>`;
                } else if (diff > 10) {
                    html += `
                    <div class="mt-2 text-[10px] text-gray-400 border-t pt-2 border-dashed">
                        <i class="fas fa-info-circle"></i> 다음 수업 안내는 시작 10분 전에 표시됩니다.
                    </div>`;
                }
            }
            infoBox.innerHTML = html;
        };

        window.openAdminPanel = () => {
            document.getElementById('admin-auth').classList.remove('hidden');
            document.getElementById('admin-editor').classList.add('hidden');
            document.getElementById('admin-pw').value = '';
            document.getElementById('admin-modal').classList.remove('hidden');
        };
        window.closeAdminPanel = () => document.getElementById('admin-modal').classList.add('hidden');
        window.checkAdminPw = () => {
            if (document.getElementById('admin-pw').value === '1234') {
                document.getElementById('admin-auth').classList.add('hidden');
                document.getElementById('admin-editor').classList.remove('hidden');
                document.getElementById('new-notice').value = document.getElementById('notice-content').innerText;
            } else { alert('비밀번호가 틀렸습니다.'); }
        };
        window.saveNotice = async () => {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notices', 'main'), { 
                    content: document.getElementById('new-notice').value, updated: new Date().getTime() 
                });
                closeAdminPanel();
            } catch (e) { alert("저장 실패"); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('loading-section').classList.remove('hidden');
                
                try {
                    const docSnap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'config'));
                    if (docSnap.exists()) {
                        userSubjects = docSnap.data();
                        document.getElementById('loading-section').classList.add('hidden');
                        document.getElementById('main-section').classList.remove('hidden');
                        renderTimetable();
                    } else { showSetup(); }
                } catch (e) { showSetup(); }

                try {
                    onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'notices', 'main'), (snap) => {
                        if (snap.exists()) document.getElementById('notice-content').innerText = snap.data().content;
                    });
                } catch (e) {}
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('main-section').classList.add('hidden');
                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('setup-section').classList.add('hidden');
            }
        });

        document.getElementById('google-login-btn').addEventListener('click', login);
        document.getElementById('save-subjects-btn').addEventListener('click', saveSubjects);
        window.showSetup = showSetup;
        
        setInterval(updateRealTime, 1000);
        updateRealTime();
    </script>
</body>
</html>
